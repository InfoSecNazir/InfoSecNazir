<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Student Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-100">
    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold">
                        <i class="fas fa-graduation-cap"></i> SSMS
                    </h1>
                    <span class="text-sm opacity-75">Smart Student Management System</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="{% url 'students:home' %}" class="hover:text-blue-200 transition">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="{% url 'students:dashboard' %}" class="hover:text-blue-200 transition">
                        <i class="fas fa-chart-line"></i> Dashboard
                    </a>
                    <a href="{% url 'students:student_list' %}" class="hover:text-blue-200 transition">
                        <i class="fas fa-users"></i> Students
                    </a>
                    <a href="{% url 'students:session_list' %}" class="hover:text-blue-200 transition">
                        <i class="fas fa-calendar"></i> Sessions
                    </a>
                    <a href="{% url 'students:scanner' %}" class="hover:text-blue-200 transition">
                        <i class="fas fa-qrcode"></i> Scanner
                    </a>
                    <a href="/admin/" class="hover:text-blue-200 transition">
                        <i class="fas fa-cog"></i> Admin
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 Smart Student Management System (SSMS)</p>
            <p class="text-sm text-gray-400 mt-2">Developed by Nazeer Al-Habash</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
